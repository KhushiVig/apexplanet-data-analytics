name: Weekly Analytics Pipeline

# Runs the ApexPlanet Superstore automation pipeline on a schedule and
# commits refreshed KPI exports back to the repository. Can also be
# triggered manually from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the analytics pipeline
        run: python scripts/automate_pipeline.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}

      - name: Commit refreshed exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/cleaned_superstore.csv outputs/pipeline_exports outputs/pipeline_run.log
          git diff --cached --quiet || git commit -m "Automated pipeline refresh, $(date -u +%Y-%m-%d)"
          git push
